  entity: "ktgw543210-tokyo-university-of-agriculture-and-technology"
  tags: 'test'
  project: 'marl-col'
  group: "PPO-1000-${demand_scaler}-${demand_scale_start}_${demand_scale_end}-const-380"
  name: '${demand_scaler}-demand-seed-${seed}'
  mode: online
  log: False
gridsearch:
  time_horizon: [20]
